version: 2

project_name: figma

builds:
  - id: unix
    main: .
    binary: figma
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/branow/figma-cli/cmd.version={{.Version}}

  - id: macos
    main: .
    binary: figma
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    # Signed with the release certificate; see scripts/sign.sh for what it
    # does and does not keep across upgrades. codesign needs macOS, so the
    # release runs on a macOS runner.
    hooks:
      post:
        - cmd: ./scripts/sign.sh "{{ .Path }}"
          output: true
    ldflags:
      - -s -w -X github.com/branow/figma-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  # The cask token is figma-cli, not figma: homebrew/cask already owns
  # "figma" for the Figma desktop app, and two casks with one token cannot
  # coexist in the Caskroom — an unqualified `brew upgrade figma` resolves to
  # the official cask and replaces this CLI with the desktop app. The
  # installed command stays `figma`.
  - name: figma-cli
    # The cask token drives the binary stanza by default, which would link the
    # command as figma-cli and point at a file the archive does not contain.
    binary: figma
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/figma-cli
    description: Command-line interface for the Figma REST API
    # The binaries are signed with a self-signed certificate, not notarized
    # with an Apple Developer ID, so strip the quarantine attribute Homebrew
    # puts on cask downloads; otherwise Gatekeeper refuses to run figma.
    #
    # Written as a custom_block because goreleaser's `hooks` still render the
    # `postflight do` stanza Homebrew deprecated in favour of
    # `postflight_steps` (goreleaser/goreleaser#6870).
    #
    # Inside postflight_steps the paths are declarative template tokens the
    # installer expands, NOT Ruby: `#{staged_path}` is interpolated at
    # cask-load time against a DSL that has no such method, which makes the
    # whole cask unreadable. The literal {{staged_path}} is what Homebrew
    # expands, wrapped in a goreleaser template string so goreleaser's own
    # {{...}} pass leaves it alone instead of failing on an unknown function.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/figma"]
        end
      end

nfpms:
  - package_name: figma
    ids: [unix]
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/figma-cli
    description: Command-line interface for the Figma REST API
    license: MIT
    bindir: /usr/bin

scoops:
  - name: figma
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/figma-cli
    description: Command-line interface for the Figma REST API
    license: MIT

changelog:
  use: git
